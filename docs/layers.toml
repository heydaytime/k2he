# What every key does on every layer, for the reference images in docs/layers/.
# Edit this whenever keymap.c changes, then run scripts/render-layers.
#
# Each layer lists its keys row by row, in the same order as LAYOUT_ansi_84 in
# keymap.c (16, 15, 15, 14, 14, 10 keys). A key is either:
#   "Label"                          a plain key; "\n" splits it into two lines
#                                    (top = with Shift, bottom = tap, like a keycap)
#   { label = "…", kind = "…" }      a key drawn in a color, kind is one of:
#                                    macro, swap, layer, light, wireless
#   "_"                              transparent: falls through to the base layer
# `notes` are printed under the layer's picture.

[kinds]
macro = "custom key or macro (see notes)"
swap = "Shift swapped: tap gives the symbol, Shift the digit"
layer = "layer key"
light = "backlight"
wireless = "Bluetooth, 2.4 GHz, battery"

[[layer]]
name = "Mac"
file = "mac"
about = "Base layer with the switch on Mac."
notes = [
    "Number row: tap types the symbol, Shift types the digit (custom shift keys).",
    "PgUp, PgDn, Home, End type the vim mark macros mQ, 'Q, mW, 'W.",
    "Ctrl-B is the tmux prefix; Ctrl-G opens Copilot.",
    "While any key signal is up, F1-F12 turn dark except the signaled keys.",
]
rows = [
    ["Esc", "Screen\n−", "Screen\n+", "Mission\nControl", "Launch-\npad",
     { label = "Light\n−", kind = "light" }, { label = "Light\n+", kind = "light" },
     "Prev", "Play\nPause", "Next", "Mute", "Vol\n−", "Vol\n+", "Screen-\nshot", "Del",
     { label = "Light\non/off", kind = "light" }],
    ["~\n`", { label = "1\n!", kind = "swap" }, { label = "2\n[", kind = "swap" },
     { label = "3\n{", kind = "swap" }, { label = "4\n(", kind = "swap" },
     { label = "5\n%", kind = "swap" }, { label = "6\n*", kind = "swap" },
     { label = "7\n&", kind = "swap" }, { label = "8\n)", kind = "swap" },
     { label = "9\n}", kind = "swap" }, { label = "0\n]", kind = "swap" },
     "_\n-", "+\n=", { label = "Ctrl-B\n(tmux)", kind = "macro" },
     { label = "PgUp\nmQ", kind = "macro" }],
    ["Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P",
     { label = "$\n@", kind = "swap" }, { label = "^\n#", kind = "swap" }, "|\n\\",
     { label = "PgDn\n'Q", kind = "macro" }],
    ["Backspace", "A", "S", "D", "F", "G", "H", "J", "K", "L",
     { label = ";\n:", kind = "swap" }, "\"\n'", "Enter",
     { label = "Home\nmW", kind = "macro" }],
    ["Shift", "Z", "X", "C", "V", "B", "N", "M", "<\n,", ">\n.", "?\n/",
     { label = "Ctrl-G\n(Copilot)", kind = "macro" }, "↑",
     { label = "End\n'W", kind = "macro" }],
    ["Ctrl", "Opt", "Cmd", "Space", "Esc", { label = "Fn", kind = "layer" }, "Opt",
     "←", "↓", "→"],
]

[[layer]]
name = "Mac Fn"
file = "mac-fn"
about = "Held with Fn on the Mac layer. Blank keys do what they do on the Mac layer."
notes = [
    "BT 1-3 switch between Bluetooth hosts, 2.4G switches to the wireless dongle.",
    "Battery shows the battery level on the backlight.",
]
rows = [
    ["_", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11", "F12",
     "_", "_", { label = "Light\non/off", kind = "light" }],
    ["_", { label = "BT 1", kind = "wireless" }, { label = "BT 2", kind = "wireless" },
     { label = "BT 3", kind = "wireless" }, { label = "2.4G", kind = "wireless" },
     "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
    [{ label = "Light\non/off", kind = "light" }, { label = "Effect\nnext", kind = "light" },
     { label = "Light\n+", kind = "light" }, { label = "Hue\n+", kind = "light" },
     { label = "Sat\n+", kind = "light" }, { label = "Speed\n+", kind = "light" },
     "_", "_", "_", "_", "_", "_", "_", "_", "_"],
    ["_", { label = "Effect\nprev", kind = "light" }, { label = "Light\n−", kind = "light" },
     { label = "Hue\n−", kind = "light" }, { label = "Sat\n−", kind = "light" },
     { label = "Speed\n−", kind = "light" },
     "_", "_", "_", "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_", { label = "Battery", kind = "wireless" }, "NKRO\non/off",
     "_", "_", "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_", { label = "Fn", kind = "layer" }, "_", "_", "_", "_"],
]

[[layer]]
name = "Windows"
file = "windows"
about = "Base layer with the switch on Windows."
notes = [
    "Auto-click clicks the left mouse button every 250 ms while held.",
    "Right Shift while Left Shift is held sends Ctrl+Y.",
]
rows = [
    ["Esc", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11", "F12",
     { label = "Auto-\nclick", kind = "macro" }, "Del",
     { label = "Effect\nnext", kind = "light" }],
    ["~\n`", "!\n1", "@\n2", "#\n3", "$\n4", "%\n5", "^\n6", "&\n7", "*\n8", "(\n9", ")\n0",
     "_\n-", "+\n=", "Backspace", "PgUp"],
    ["Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "{\n[", "}\n]", "|\n\\", "PgDn"],
    ["Backspace", "A", "S", "D", "F", "G", "H", "J", "K", "L", ":\n;", "\"\n'", "Enter", "Home"],
    ["Shift", "Z", "X", "C", "V", "B", "N", "M", "<\n,", ">\n.", "?\n/",
     { label = "Shift\n(+LShift: Ctrl+Y)", kind = "macro" }, "↑", "End"],
    ["Ctrl", "Win", "Alt", "Space", "Alt", { label = "Fn", kind = "layer" }, "Ctrl",
     "←", "↓", "→"],
]

[[layer]]
name = "Windows Fn"
file = "windows-fn"
about = "Held with Fn on the Windows layer. Blank keys do what they do on the Windows layer."
notes = [
    "BT 1-3 switch between Bluetooth hosts, 2.4G switches to the wireless dongle.",
    "Battery shows the battery level on the backlight.",
]
rows = [
    ["_", "Screen\n−", "Screen\n+", "Task\nView", "File\nExplorer",
     { label = "Light\n−", kind = "light" }, { label = "Light\n+", kind = "light" },
     "Prev", "Play\nPause", "Next", "Mute", "Vol\n−", "Vol\n+", "_", "_",
     { label = "Light\non/off", kind = "light" }],
    ["_", { label = "BT 1", kind = "wireless" }, { label = "BT 2", kind = "wireless" },
     { label = "BT 3", kind = "wireless" }, { label = "2.4G", kind = "wireless" },
     "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
    [{ label = "Light\non/off", kind = "light" }, { label = "Effect\nnext", kind = "light" },
     { label = "Light\n+", kind = "light" }, { label = "Hue\n+", kind = "light" },
     { label = "Sat\n+", kind = "light" }, { label = "Speed\n+", kind = "light" },
     "_", "_", "_", "_", "_", "_", "_", "_", "_"],
    ["_", { label = "Effect\nprev", kind = "light" }, { label = "Light\n−", kind = "light" },
     { label = "Hue\n−", kind = "light" }, { label = "Sat\n−", kind = "light" },
     { label = "Speed\n−", kind = "light" },
     "_", "_", "_", "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_", { label = "Battery", kind = "wireless" }, "NKRO\non/off",
     "_", "_", "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_", { label = "Fn", kind = "layer" }, "_", "_", "_", "_"],
]
