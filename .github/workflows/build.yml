name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          git config --global --add safe.directory '*'
          scripts/build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: keychron_k2_he_ansi_mylayout.bin

      # A release carries the flashable image and every line of source needed
      # to rebuild it (this repo, the firmware and all its libraries), so it
      # stays usable even if every upstream repository disappears.
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp keychron_k2_he_ansi_mylayout.bin "k2he-${GITHUB_REF_NAME}.bin"
          tar --exclude-vcs --exclude=.build --exclude='./*.bin' \
              -czf "$RUNNER_TEMP/source.tar.gz" .
          mv "$RUNNER_TEMP/source.tar.gz" "k2he-${GITHUB_REF_NAME}-source.tar.gz"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            k2he-${{ github.ref_name }}.bin
            k2he-${{ github.ref_name }}-source.tar.gz

  host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test keysignal
        working-directory: host
        run: uv run --group dev pytest -q
